<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FinGuard AI | محادثة ذكية - تصميم نظيف</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script src="https://cdn.jsdelivr.net/npm/react@17.0.2/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@17.0.2/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0a0f1c, #03060c);
            min-height: 100vh;
        }
        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e2a3a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #4b6b8f; border-radius: 10px; }
        
        /* تأثير زجاجي */
        .glass-card {
            background: rgba(20, 28, 40, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(5, 150, 105, 0.25); /* لون أخضر */
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        /* فقاعة المستخدم - لون أخضر */
        .user-bubble {
            background: linear-gradient(135deg, #1f6e7a9e,#1f6e7aa1);
            border-radius: 24px 24px 8px 24px;
            padding: 10px 16px;
            color: #f0f3fa;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            border: 1px solid #1f6e7a;
        }
        /* فقاعة الـ AI */
        .ai-bubble {
            background: rgba(30, 40, 55, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 24px 24px 24px 8px;
            padding: 10px 16px;
            color: #e2e8f0;
            border: 1px solid #1f6e7a;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        /* زر الإرسال - أخضر */
        .send-btn {
            background: linear-gradient(135deg, #36c2d7,#2d9fb0);
            transition: all 0.2s;
        }
        .send-btn:hover:not(:disabled) {
            transform: scale(1.02);
            background: linear-gradient(135deg, #298a99, #1f6e7a);
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        /* تأثير الكتابة */
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: #2991a1;
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.2s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }
        /* نبض للزر */
        @keyframes softPulse {
            0% { box-shadow: 0 0 0 0 #1f6e7ac9; }
            70% { box-shadow: 0 0 0 12px rgba(5, 150, 105, 0); }
            100% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0); }
        }
        .pulse-ring {
            animation: softPulse 1.8s infinite;
        }
        /* تنسيق عام */
        .input-glow:focus {
            outline: none;
            border-color: #1f6e7a;
            box-shadow: 0 0 0 2px #14464e;
        }
        button:focus, a:focus {
            outline: 2px solid #1f6e7a;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ------------------------------
        // واجهة المحادثة الرئيسية (بدون شريط جانبي)
        // ------------------------------
        function ChatInterface() {
            const getFormattedTime = () => {
                return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            };

            const [messages, setMessages] = React.useState([
                { 
                    id: crypto.randomUUID(), 
                    text: "مرحباً! أنا المساعد الذكي FinGuard AI. كيف يمكنني مساعدتك اليوم في التدقيق المالي أو الاستفسار عن السياسات؟", 
                    sender: "ai", 
                    time: getFormattedTime() 
                }
            ]);
            const [input, setInput] = React.useState("");
            const [isTyping, setIsTyping] = React.useState(false);
            const [isSending, setIsSending] = React.useState(false);
            const messagesEndRef = React.useRef(null);
            const fileInputRef = React.useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            React.useEffect(() => {
                scrollToBottom();
            }, [messages]);

            React.useEffect(() => {
                if (isTyping) scrollToBottom();
            }, [isTyping]);

            const getAIResponse = (userMessage) => {
                const lowerMsg = userMessage.toLowerCase();
                if (lowerMsg.includes("سياسة") || lowerMsg.includes("قانون")) {
                    return "يمكنني الاطلاع على سياسات الشركة مثل سياسة المشتريات التقنية (حد 3000$)، وسياسة مكافحة غسيل الأموال، وسياسة السفر. هل تريد تفصيلاً لأي منها؟";
                } else if (lowerMsg.includes("طلب") || lowerMsg.includes("اعتماد")) {
                    return "لتحليل طلب مالي، يرجى استخدام صفحة 'تحليل AI' المخصصة. يمكنك إدخال الغرض والمبلغ وسأقارنه بالسياسات المخزنة في قاعدة RAG.";
                } else if (lowerMsg.includes("شكر")) {
                    return "على الرحب والسعة! أنا هنا لمساعدتك في أي استفسار مالي.";
                } else {
                    return "شكراً لتواصلك. أنا FinGuard AI، متخصص في التدقيق المالي والامتثال. يمكنك سؤالي عن سياسة معينة، أو طلب تحليل طلب، أو الاستفسار عن نظام RAG.";
                }
            };

            const handleSendMessage = async () => {
                const trimmedInput = input.trim();
                if (!trimmedInput || isSending || isTyping) return;

                setIsSending(true);
                const userMsg = {
                    id: crypto.randomUUID(),
                    text: trimmedInput,
                    sender: "user",
                    time: getFormattedTime()
                };
                setMessages(prev => [...prev, userMsg]);
                setInput("");
                setIsTyping(true);

                const delay = 800 + Math.random() * 700;
                try {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    const aiReply = {
                        id: crypto.randomUUID(),
                        text: getAIResponse(trimmedInput),
                        sender: "ai",
                        time: getFormattedTime()
                    };
                    setMessages(prev => [...prev, aiReply]);
                } catch (error) {
                    const errorMsg = {
                        id: crypto.randomUUID(),
                        text: "عذراً، حدث خلل في الاتصال. حاول مرة أخرى.",
                        sender: "ai",
                        time: getFormattedTime()
                    };
                    setMessages(prev => [...prev, errorMsg]);
                } finally {
                    setIsTyping(false);
                    setIsSending(false);
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !isSending && !isTyping) {
                    e.preventDefault();
                    handleSendMessage();
                }
            };

            const handleAttachFile = () => {
                fileInputRef.current?.click();
            };

            const onFileSelected = (e) => {
                const file = e.target.files[0];
                if (file) {
                    alert(`تم اختيار الملف: ${file.name}\n(هذه تجربة واجهة فقط، الرفع غير مفعل)`);
                }
                e.target.value = null;
            };

            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="h-screen flex flex-col bg-gradient-to-br from-[#070b14] to-[#0f1622]">
                    {/* رأس الدردشة مع أيقونة المنزل في الأعلى (يمين في RTL) */}
                    <div className="glass-card mx-4 mt-4 rounded-2xl p-3 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-emerald-600/30 flex items-center justify-center">
                                <i className="fas fa-robot text-emerald-300 text-xl"></i>
                            </div>
                            <div>
                                <h2 className="text-white font-bold">FinGuard AI Chat</h2>
                                <p className="text-xs text-emerald-300/70">متصل | مدقق مالي ذكي</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            {/* أيقونة المنزل هنا في الأعلى */}
                            <button 
                                onClick={scrollToTop}
                                className="text-gray-300 hover:text-emerald-400 transition p-2 rounded-full hover:bg-white/10"
                                aria-label="المنزل / أعلى الصفحة"
                            >
                                <i className="fas fa-home text-xl"></i>
                            </button>
                            <button className="text-gray-400 hover:text-white transition p-2" aria-label="القائمة">
                                <i className="fas fa-ellipsis-v"></i>
                            </button>
                        </div>
                    </div>

                    {/* منطقة الرسائل */}
                    <div className="flex-1 overflow-y-auto px-4 py-4 space-y-4">
                        {messages.map((msg) => (
                            <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[80%] sm:max-w-[70%] ${msg.sender === 'user' ? 'user-bubble' : 'ai-bubble'}`}>
                                    <div className="flex items-center gap-2 mb-1">
                                        {msg.sender === 'ai' ? <i className="fas fa-microchip text-emerald-400 text-xs"></i> : <i className="fas fa-user text-gray-300 text-xs"></i>}
                                        <span className="text-xs opacity-70">{msg.sender === 'ai' ? 'FinGuard AI' : 'أنت'}</span>
                                        <span className="text-[10px] opacity-50">{msg.time}</span>
                                    </div>
                                    <p className="text-sm leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                                </div>
                            </div>
                        ))}
                        {isTyping && (
                            <div className="flex justify-start">
                                <div className="ai-bubble flex items-center gap-2">
                                    <i className="fas fa-microchip text-emerald-400 text-xs"></i>
                                    <div className="typing-indicator flex gap-1">
                                        <span></span><span></span><span></span>
                                    </div>
                                    <span className="text-xs text-gray-400 mr-1">يكتب...</span>
                                </div>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    {/* شريط الإدخال */}
                    <div className="p-4 glass-card mx-4 mb-4 rounded-2xl">
                        <div className="flex items-center gap-3">
                            <button 
                                onClick={handleAttachFile} 
                                className="text-gray-400 hover:text-emerald-400 transition disabled:opacity-50"
                                disabled={isSending || isTyping}
                                aria-label="إرفاق ملف"
                            >
                                <i className="fas fa-paperclip text-lg"></i>
                            </button>
                            <input 
                                type="text" 
                                value={input} 
                                onChange={(e) => setInput(e.target.value)} 
                                onKeyDown={handleKeyPress}
                                placeholder="اكتب سؤالك المالي هنا..."
                                disabled={isSending || isTyping}
                                className="flex-1 bg-transparent border-none outline-none text-white placeholder-gray-500 text-sm disabled:opacity-60"
                            />
                            <button 
                                onClick={handleSendMessage} 
                                disabled={!input.trim() || isSending || isTyping}
                                className="send-btn text-white p-2 rounded-full w-9 h-9 flex items-center justify-center disabled:opacity-50"
                                aria-label="إرسال"
                            >
                                <i className="fas fa-paper-plane text-sm"></i>
                            </button>
                        </div>
                        <div className="flex gap-3 mt-2 text-xs text-gray-400 px-1">
                            <span><i className="fas fa-database ml-1"></i> RAG نشط</span>
                            <span><i className="fas fa-shield-alt ml-1"></i> تدقيق فوري</span>
                        </div>
                        <input type="file" ref={fileInputRef} style={{ display: 'none' }} onChange={onFileSelected} accept=".pdf,.doc,.docx,.txt" />
                    </div>
                </div>
            );
        }

        // ------------------------------
        // التطبيق الرئيسي (بدون Sidebar ولا أزرار عائمة سفلية)
        // ------------------------------
        function App() {
            return (
                <div className="min-h-screen bg-transparent">
                    <ChatInterface />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
